name: Test compile VARTOOLS on Ubuntu

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    # Manually enable/disable this test
    # Write an if statement that is always true/false
    if: true
    steps:
      - uses: actions/checkout@v3
      - name: Update apt-get
        run: sudo apt-get update
      - name: Install gfortran
        run: sudo apt-get install gfortran
      - name: Install CFITSIO
        run: sudo apt-get install libcfitsio-dev
      - name: Install GSL
        run: sudo apt-get install libgsl-dev
      - name: Install R dev libraries
        run: sudo apt-get install r-base-dev
      # Set up Python BEFORE ./configure: vartools's configure looks
      # for ${PYTHON}-config and tries to import numpy to locate the
      # headers (configure.ac:201-260).  Without dev headers + numpy
      # available at configure time, libvartoolspipeline.so builds
      # without _HAVE_PYTHON, which breaks `-python` everywhere.  The
      # same Python is used by setup-python, the embedded interpreter,
      # and the pytest runner -- avoids ABI mismatch on the embedded
      # Python.so.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python build deps (visible at configure time)
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy
      - name: Debug — verify numpy headers are reachable in CI
        # configure runs `python -c "import numpy; print(numpy.get_include())"`
        # to compute NUMPY_INCLUDE_DIR, then AC_CHECK_HEADERs
        # ${NUMPY_INCLUDE_DIR}/numpy/arrayobject.h with "#include
        # Python.h" as prologue.  If this step shows the file exists
        # but configure says "no", the failure is in the prologue
        # compile, not the path.
        run: |
          set -x
          which python
          which python3-config
          python --version
          python -c "import numpy; print('numpy', numpy.__version__); print('include:', numpy.get_include())"
          NUMPY_INC=$(python -c "import numpy; print(numpy.get_include())")
          ls -la "$NUMPY_INC/numpy/arrayobject.h" || echo "MISSING: $NUMPY_INC/numpy/arrayobject.h"
          python3-config --cflags --embed 2>/dev/null || python3-config --cflags
          python3-config --ldflags --embed 2>/dev/null || python3-config --ldflags
      - name: Configure VARTOOLS
        # The AX_PYTHON_DEFAULT macro defaults Python support OFF;
        # need --enable-python=PATH to turn it on (m4/ax_python_embed.m4
        # AX_PYTHON_ENABLE).  The plain `--enable-python` form would
        # search only /usr/bin, missing setup-python's
        # /opt/hostedtoolcache install -- so pass the explicit path.
        #
        # Also pass --with-pythonconfig=$(which python3-config)
        # explicitly: setup-python ships `python3-config` but not the
        # bare `python-config`, so the default check for
        # `${PYTHON}-config` (configure.ac:212) fails.  Without
        # python-config, PYTHON_CSPEC is unset and the subsequent
        # AC_CHECK_HEADER for numpy/arrayobject.h fails because its
        # prologue `#include "Python.h"` can't find Python.h.
        run: |
          ./configure \
            --enable-python=$(which python) \
            --with-pythonconfig=$(which python3-config)
      - name: Debug — confirm Python+NumPy were detected at configure time
        # AC_CHECK_HEADER for arrayobject.h is non-fatal; configure
        # succeeds whether or not Python is wired up.  Inspect
        # config.h and config.log to see what actually got defined,
        # and (on failure) the compiler error from the AC_CHECK_HEADER
        # test program.
        if: always()
        run: |
          set -x
          echo '---- HAVE_PYTHON in config.h ----'
          grep -E 'HAVE_PYTHON|NUMPY' config.h || true
          echo '---- AC_CHECK_HEADER region of config.log ----'
          grep -n -A 30 'arrayobject\.h' config.log | head -200 || true
          echo '---- last 80 lines of config.log ----'
          tail -80 config.log
      - name: make VARTOOLS
        run: make
      - name: Install VARTOOLS
        run: sudo make install
      - name: Install Python test deps
        run: python -m pip install pytest pytest-cov pandas astropy
      - name: Install pyvartools
        # No sudo: `make install-python` runs `pip install .` and we
        # want it in setup-python's site-packages (not the system
        # python3 -- sudo strips PATH and would resolve a different
        # pip).
        run: make install-python
      # `make install-python` runs `pip install .` from the srcdir's
      # python/ subtree.  libvartoolspipeline.so lives at
      # $prefix/share/vartools/USERLIBS/.  pyvartools' find_library()
      # search includes the binary's RPATH and ldconfig, but libtool
      # can strip the build-tree RPATH at install time and USERLIBSDIR
      # isn't in the default ldconfig path on a fresh Ubuntu image.
      # Set VARTOOLS_LIBRARY explicitly so the runtime-config branch
      # of find_library() picks it up.
      - name: Run pyvartools tests
        env:
          VARTOOLS_LIBRARY: /usr/local/share/vartools/USERLIBS/libvartoolspipeline.so
        run: |
          ls -la /usr/local/share/vartools/USERLIBS/ || true
          cd python
          python -m pytest tests/ -q --tb=line --maxfail=10
